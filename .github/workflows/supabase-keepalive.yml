name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after 7 days with no activity. This runs
# independently of Vercel's own /api/cron/ping-supabase cron as a redundant safety net,
# since Vercel Hobby-plan cron scheduling isn't guaranteed to fire exactly on schedule.
#
# Runs DAILY (tightened from every-2-days on 2026-09-04 after the project was paused
# despite the every-2-days schedule succeeding beforehand — a plain PostgREST read may
# not reliably count as "activity" for Supabase's pause detection, so this also hits
# the Auth health endpoint as a second signal, and writes a heartbeat row so there's a
# genuine write, not just a read, going to the database).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (read) to keep the project active
        run: |
          set -e
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/guides?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "REST read HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Supabase REST read ping failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Ping Supabase Auth health endpoint (second activity signal)
        run: |
          set -e
          HTTP_STATUS=$(curl -s -o /tmp/auth_response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "Auth health HTTP status: $HTTP_STATUS"
          cat /tmp/auth_response.json
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::warning::Supabase Auth health ping failed with status $HTTP_STATUS"
          fi
